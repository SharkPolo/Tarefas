<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f6f6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tarefas" />
  <title>Tarefas</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23111111'/%3E%3Cpolyline points='150 265 225 340 366 185' fill='none' stroke='%23ffffff' stroke-width='44' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f6f6f6;
      --surface: #ffffff;
      --row-hover: rgba(0, 0, 0, 0.035);
      --border: #e5e7eb;
      --border-strong: #9ca3af;
      --text: #333333;
      --text-heading: #4b5563;
      --text-muted: #888d96;
      --accent: #2563eb;
      --star-active: #111111;
      --amber: #d97706;
      --p1: #dc2626;
      --p2: #f97316;
      --green: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 70px;
      -webkit-font-smoothing: antialiased;
    }

    /* Botão + flutuante em cima da lista no canto superior direito */
    .top-actions {
      position: fixed;
      top: 14px;
      right: 16px;
      display: flex;
      align-items: center;
      z-index: 45;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(246, 246, 246, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--text-heading);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, color 0.15s, transform 0.12s;
    }
    .icon-btn:hover { background: rgba(0, 0, 0, 0.07); }
    .icon-btn:active { transform: scale(0.95); }

    .modal-gear-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .modal-gear-btn:hover {
      background: var(--bg);
      color: var(--text);
    }

    /* Menu Dropdown da Engrenagem (dentro da janela Nova Tarefa) */
    .gear-menu {
      position: absolute;
      top: 38px;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 175px;
      padding: 6px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 70;
    }
    .gear-menu.open { display: flex; }

    .gear-menu button {
      background: transparent;
      border: none;
      color: var(--text);
      text-align: left;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .gear-menu button:hover { background: var(--bg); }

    .menu-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Área Principal */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 20px 70px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .empty-msg {
      color: #b0b5bd;
      font-size: 0.9rem;
      padding: 12px 6px;
    }

    /* Linha de Tarefa Minimalista */
    .task-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px;
      border-radius: 10px;
      transition: background 0.15s, opacity 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .task-row:hover { background: var(--row-hover); }
    .task-row.blocked { opacity: 0.65; }
    .task-row.completed { opacity: 0.6; }
    .task-row.completed .task-title { text-decoration: line-through; }

    .task-row[data-starred="true"] {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Barra lateral fina de prioridade (P1/P2) */
    .prio-bar {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
      border-radius: 4px;
    }
    .prio-bar.p-1 { background: var(--p1); }
    .prio-bar.p-2 { background: var(--p2); }

    /* Estados visuais ao segurar e arrastar */
    .task-row.dragging {
      opacity: 0.55;
      background: var(--surface);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transform: scale(1.01);
      z-index: 5;
    }
    .task-row.drag-over-top { box-shadow: inset 0 2px 0 0 var(--text-heading); }
    .task-row.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--text-heading); }

    /* Check mark minimalista na frente da tarefa */
    .check-btn {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.4px solid #c2c6ce;
      background: transparent;
      color: #a6abb4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .check-btn svg {
      opacity: 0.55;
      transition: opacity 0.15s;
    }
    .check-btn:hover {
      border-color: var(--green);
      background: rgba(22, 163, 74, 0.08);
      color: var(--green);
    }
    .check-btn:hover svg { opacity: 1; }

    .task-content {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .task-title {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text);
      word-break: break-word;
    }

    .task-submeta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 2px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .task-submeta:empty { display: none; }

    .meta-overdue { color: var(--danger); font-weight: 500; }
    .meta-today { color: var(--amber); font-weight: 500; }
    .meta-blocked { color: var(--danger); }
    .meta-tag { color: var(--accent); }

    /* Estrela à direita (preenchimento preto quando ativa) */
    .star-btn {
      background: transparent;
      border: none;
      color: #c2c6ce;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }
    .star-btn:hover {
      color: var(--text-heading);
      background: rgba(0, 0, 0, 0.04);
    }
    .star-btn.active { color: var(--star-active); }
    .star-btn.active:hover { color: #000000; }

    /* Modais (Clean Light) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }

    /* Janela de Nova Tarefa posicionada no topo da página */
    #createModal.modal-backdrop {
      align-items: flex-start;
      padding-top: 14px;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .modal-header h3 {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text);
    }

    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .close-x {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .close-x:hover { background: var(--bg); color: var(--text); }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }

    input[type="text"], input[type="number"], input[type="datetime-local"], select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-family: inherit;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--text-heading);
      background: #ffffff;
    }
    textarea { min-height: 90px; resize: vertical; }

    .check-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .check-inline input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--text-heading);
    }

    details.advanced-box {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    details.advanced-box summary {
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      margin-bottom: 10px;
    }
    .advanced-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 4px;
    }

    .btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #eceef1; }
    .btn-dark { background: #333333; border-color: #333333; color: #ffffff; }
    .btn-dark:hover { background: #1f1f1f; }
    .btn-green { background: var(--green); border-color: var(--green); color: #ffffff; }
    .btn-green:hover { background: #15803d; }
    .btn-danger { background: #fef2f2; border-color: #fecaca; color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #ffffff; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    /* Subtarefas, Markdown e Anexos */
    .item-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      gap: 8px;
    }
    .md-switch { display: flex; gap: 6px; }
    .md-switch button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      cursor: pointer;
    }
    .md-switch button.active { background: #333333; border-color: #333333; color: #ffffff; }
    .md-view {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px;
      min-height: 90px;
      font-size: 0.88rem;
    }
    .md-view a { color: var(--accent); }
    .md-view code { background: #e5e7eb; padding: 2px 5px; border-radius: 4px; }
    .md-view pre { background: #f1f5f9; border: 1px solid var(--border); padding: 8px; border-radius: 6px; overflow-x: auto; margin: 5px 0; }
    .md-view ul { padding-left: 18px; }

    /* Alarme */
    .alarm-box {
      border: 1.5px solid var(--danger);
      box-shadow: 0 15px 40px rgba(220, 38, 38, 0.18);
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: #333333;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      z-index: 90;
      display: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    /* Em telas estreitas, garante que o + flutuante não cubra a estrela do 1º item */
    @media (max-width: 720px) {
      #taskList .task-row:first-child {
        padding-right: 48px;
      }
    }

    @media (max-width: 540px) {
      main { padding: 14px 14px 70px; }
      .top-actions { top: 14px; right: 16px; }
      #createModal.modal-backdrop { padding-top: 10px; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="top-actions">
  <button type="button" class="icon-btn" onclick="openCreateModal()" title="Nova Tarefa" aria-label="Nova Tarefa">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>
</div>

<main>
  <div id="taskList" class="task-list"></div>
</main>

<!-- Modal: Nova Tarefa (+) no topo da página com engrenagem integrada -->
<div id="createModal" class="modal-backdrop" onclick="closeOnBackdrop(event, 'createModal')">
  <form class="modal-box" onsubmit="handleCreateTask(event)">
    <div class="modal-header">
      <h3>Nova Tarefa</h3>
      <div class="modal-header-actions">
        <button type="button" id="gearBtn" class="modal-gear-btn" onclick="toggleGearMenu(event)" title="Opções" aria-label="Opções">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <div id="gearMenu" class="gear-menu">
          <button type="button" onclick="openCompletedFromMenu()">
            <span>Concluídas</span>
            <span id="menuCompletedCount" class="menu-badge">0</span>
          </button>
          <button type="button" onclick="openConfigFromMenu()">Nuvem</button>
          <button type="button" onclick="syncFromMenu()">Sincronizar</button>
          <button type="button" id="installAppBtn" style="display:none;" onclick="installPwaFromMenu()">Instalar app</button>
        </div>

        <button type="button" class="close-x" onclick="closeModal('createModal')">✕</button>
      </div>
    </div>

    <div class="field">
      <input type="text" id="newTitle" enterkeyhint="done" placeholder="O que precisa ser feito?" aria-label="Título" required onkeydown="if(event.key==='Enter'||event.keyCode===13){event.preventDefault();this.blur();this.form.requestSubmit();}" />
    </div>

    <div class="field">
      <select id="newPriority" tabindex="-1" aria-label="Prioridade">
        <option value="1">Urgente</option>
        <option value="2">Alta</option>
        <option value="3" selected>Normal</option>
        <option value="4">Baixa</option>
      </select>
    </div>

    <details id="newAdvancedDetails" class="advanced-box">
      <summary>Mais detalhes</summary>
      <div class="advanced-fields">
        <div class="field">
          <label>Prazo</label>
          <input type="datetime-local" id="newDue" />
        </div>

        <div class="field-row">
          <div class="field">
            <label>Alerta / Despertador</label>
            <select id="newAlertType">
              <option value="none">Sem alerta</option>
              <option value="notification">Notificação</option>
              <option value="alarm">Despertador sonoro</option>
            </select>
          </div>
          <div class="field">
            <label>Horário do Alerta</label>
            <input type="datetime-local" id="newAlertTime" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Recorrência</label>
            <select id="newRecMode" onchange="toggleNewRecFields()">
              <option value="none">Não se repete</option>
              <option value="calendar">Por calendário</option>
              <option value="completion">Dias após conclusão</option>
            </select>
          </div>
          <div class="field" id="newRecTypeWrap" style="display:none;">
            <label>Frequência</label>
            <select id="newRecType">
              <option value="daily">Diária</option>
              <option value="weekly">Semanal</option>
              <option value="monthly">Mensal</option>
              <option value="yearly">Anual</option>
            </select>
          </div>
          <div class="field" id="newRecIntervalWrap" style="display:none;">
            <label>Dias após concluir</label>
            <input type="number" id="newRecInterval" min="1" value="1" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Bloqueada por</label>
            <select id="newDependsOn">
              <option value="">Nenhuma</option>
            </select>
          </div>
          <div class="field">
            <label>Etiquetas (vírgula)</label>
            <input type="text" id="newTags" placeholder="trabalho, casa" />
          </div>
        </div>

        <div class="field">
          <label>Notas (Markdown)</label>
          <textarea id="newNotes" placeholder="Detalhes, links ou passos..."></textarea>
        </div>
      </div>
    </details>

    <div class="modal-footer">
      <button type="button" class="btn" onclick="closeModal('createModal')">Cancelar</button>
      <button type="submit" class="btn btn-dark">Salvar</button>
    </div>
  </form>
</div>

<!-- Modal: Editar / Detalhes / Concluir Tarefa -->
<div id="editModal" class="modal-backdrop" onclick="closeOnBackdrop(event, 'editModal')">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Detalhes</h3>
      <button type="button" class="close-x" onclick="closeEditModal()">✕</button>
    </div>

    <div class="field">
      <label>Título</label>
      <input type="text" id="editTitle" oninput="scheduleEditSave()" onchange="saveEditChanges()" />
    </div>

    <label class="check-inline">
      <input type="checkbox" id="editIsToday" onchange="saveEditChanges()" /> Destacar com estrela no topo
    </label>

    <div class="field-row">
      <div class="field">
        <label>Prioridade</label>
        <select id="editPriority" onchange="saveEditChanges()">
          <option value="1">Urgente</option>
          <option value="2">Alta</option>
          <option value="3">Normal</option>
          <option value="4">Baixa</option>
        </select>
      </div>
      <div class="field">
        <label>Prazo</label>
        <input type="datetime-local" id="editDue" onchange="saveEditChanges()" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Tipo de Alerta</label>
        <select id="editAlertType" onchange="saveEditChanges()">
          <option value="none">Sem alerta</option>
          <option value="notification">Notificação</option>
          <option value="alarm">Despertador sonoro</option>
        </select>
      </div>
      <div class="field">
        <label>Horário do Alerta</label>
        <input type="datetime-local" id="editAlertTime" onchange="saveEditChanges()" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Bloqueada por</label>
        <select id="editDependsOn" onchange="saveEditChanges()">
          <option value="">Nenhuma</option>
        </select>
      </div>
      <div class="field">
        <label>Etiquetas</label>
        <input type="text" id="editTags" placeholder="ex: trabalho, urgente" oninput="scheduleEditSave()" onchange="saveEditChanges()" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Recorrência</label>
        <select id="editRecMode" onchange="toggleEditRecFields(); saveEditChanges();">
          <option value="none">Não se repete</option>
          <option value="calendar">Por calendário</option>
          <option value="completion">Dias após conclusão</option>
        </select>
      </div>
      <div class="field" id="editRecTypeWrap" style="display:none;">
        <label>Frequência</label>
        <select id="editRecType" onchange="saveEditChanges()">
          <option value="daily">Diária</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensal</option>
          <option value="yearly">Anual</option>
        </select>
      </div>
      <div class="field" id="editRecIntervalWrap" style="display:none;">

    <!-- Subtarefas -->
    <div class="field">
      <label>Subtarefas</label>
      <div style="display:flex; gap:6px;">
        <input type="text" id="newSubInput" placeholder="Nova subtarefa..." onkeydown="if(event.key==='Enter'){event.preventDefault();addSubtask();}" />
        <button type="button" class="btn" onclick="addSubtask()">+</button>

        </div>

    <!-- Anexos Google Drive -->

    <div class="modal-footer" style="justify-content:space-between; border-top:1px solid var(--border); padding-top:12px;">
      <button type="button" class="btn btn-danger" onclick="deleteTask()">Excluir</button>
      <div style="display:flex; gap:8px;">
        <button type="button" id="toggleCompleteBtn" class="btn btn-green" onclick="toggleCompleteFromModal()">Concluir tarefa</button>
        <button type="button" class="btn btn-dark" onclick="closeEditModal()">Fechar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Tarefas Concluídas (via Engrenagem) -->
<div id="completedModal" class="modal-backdrop" onclick="closeOnBackdrop(event, 'completedModal')">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="completedModalTitle">Concluídas (0)</h3>
      <div style="display:flex; align-items:center; gap:8px;">
        <button type="button" id="clearCompletedBtn" class="btn btn-danger" style="padding:5px 10px; font-size:0.78rem; display:none;" onclick="clearAllCompleted()">Limpar todas</button>
        <button type="button" class="close-x" onclick="closeModal('completedModal')">✕</button>
      </div>
    </div>
    <div id="completedList" class="task-list"></div>
  </div>
</div>

<!-- Modal: Configuração da Nuvem -->
<div id="configModal" class="modal-backdrop" onclick="closeOnBackdrop(event, 'configModal')">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Configuração da Nuvem</h3>
      <button type="button" class="close-x" onclick="closeModal('configModal')">✕</button>
    </div>
    <div class="field">
      <label>URL do Web App (Google Apps Script)</label>
      <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" />
    </div>
    <div class="field">
      <label>Token Secreto</label>
      <input type="text" id="cfgToken" placeholder="Sua senha configurada no script" />
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" onclick="closeModal('configModal')">Cancelar</button>
      <button type="button" class="btn btn-dark" onclick="saveCloudConfig()">Salvar e Sincronizar</button>
    </div>

</div>

<!-- Modal: Despertador Sonoro -->
<div id="alarmModal" class="modal-backdrop">
  <div class="modal-box alarm-box">
    <div style="color:var(--danger); font-weight:600; font-size:0.95rem;">DESPERTADOR</div>
    <div id="alarmTitle" style="font-size:1.15rem; font-weight:500;"></div>
    <div id="alarmDue" style="font-size:0.85rem; color:var(--text-muted);"></div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
      <button type="button" class="btn" onclick="snoozeAlarm(5)">Adiar 5 min</button>
      <button type="button" class="btn" onclick="snoozeAlarm(15)">Adiar 15 min</button>
      <button type="button" class="btn btn-dark" onclick="dismissAlarm()">Dispensar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tf_tasks") || "[]");
  let config = JSON.parse(localStorage.getItem("tf_config") || '{"url":"","token":""}');
  let currentEditId = null;
  let editSaveTimer = null;
  let audioCtx = null;
  let alarmTimer = null;
  let activeAlarmId = null;
  let deferredInstallPrompt = null;

  // Fila de sincronização serializada (evita race conditions na planilha)
  let syncDebounceTimer = null;
  let isSyncInFlight = false;
  let hasPendingSync = localStorage.getItem("tf_dirty") === "1";

  // Controle de Drag & Drop otimizado (cache de retângulos + rAF)
  let draggedTaskId = null;
  let dropTargetId = null;
  let dropInsertAfter = false;
  let longPressTimer = null;
  let isTouchDragging = false;
  let touchStartX = 0;
  let touchStartY = 0;
  let justDragged = false;
  let dragRowMetrics = [];
  let dragRafPending = false;
  let lastPointerY = 0;

  // Registro do Service Worker para execução offline no Android
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  // Captura o prompt de instalação do Android/Chrome
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById("installAppBtn");
    if (btn) btn.style.display = "flex";
  });

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    const btn = document.getElementById("installAppBtn");
    if (btn) btn.style.display = "none";
    showToast("Aplicativo instalado");
  });

  window.addEventListener("DOMContentLoaded", () => {
    normalizeStarOrder();
    renderAll();

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
    if (config.url && config.token && navigator.onLine) {
      pullFromCloud(true);
    }

    setInterval(checkAlerts, 15000);

    // Sincroniza automaticamente quando o Android recupera conexão
    window.addEventListener("online", () => {
      if (config.url && config.token) {
        pullFromCloud(true);
      }
    });

    // Verifica alertas imediatamente ao voltar para a aba e envia pendências ao sair
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        checkAlerts();
      } else if (document.visibilityState === "hidden" && (syncDebounceTimer || hasPendingSync)) {
        clearTimeout(syncDebounceTimer);
        syncDebounceTimer = null;
        flushCloudSync(true);
      }
    });

    // Atalhos globais de teclado (Esc para fechar modais, Ctrl+Enter para salvar)
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const gear = document.getElementById("gearMenu");
        if (gear.classList.contains("open")) {
          gear.classList.remove("open");
          return;
        }
        if (document.getElementById("createModal").classList.contains("open")) closeModal("createModal");
        else if (document.getElementById("editModal").classList.contains("open")) closeEditModal();
        else if (document.getElementById("completedModal").classList.contains("open")) closeModal("completedModal");
        else if (document.getElementById("configModal").classList.contains("open")) closeModal("configModal");
      } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        if (document.getElementById("createModal").classList.contains("open")) {
          e.preventDefault();
          document.querySelector("#createModal form").requestSubmit();
        } else if (document.getElementById("editModal").classList.contains("open")) {
          e.preventDefault();
          closeEditModal();
        }
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#gearBtn") && !e.target.closest("#gearMenu")) {
        document.getElementById("gearMenu").classList.remove("open");
      }
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    });
  });

  // --- MENU ENGRENAGEM ---
  function toggleGearMenu(e) {
    e.stopPropagation();
    document.getElementById("gearMenu").classList.toggle("open");
  }

  function openCompletedFromMenu() {
    document.getElementById("gearMenu").classList.remove("open");
    closeModal("createModal");
    renderCompletedModal();
    openModal("completedModal");
  }

  function openConfigFromMenu() {
    document.getElementById("gearMenu").classList.remove("open");
    closeModal("createModal");
    document.getElementById("cfgUrl").value = config.url || "";
    document.getElementById("cfgToken").value = config.token || "";
    openModal("configModal");
  }

  function syncFromMenu() {
    document.getElementById("gearMenu").classList.remove("open");
    if (!config.url || !config.token) return openConfigFromMenu();
    pullFromCloud(false);
  }

  async function installPwaFromMenu() {
    document.getElementById("gearMenu").classList.remove("open");
    closeModal("createModal");
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if (outcome === "accepted") {
      deferredInstallPrompt = null;
      document.getElementById("installAppBtn").style.display = "none";
    }
  }

  // --- NUVEM (GOOGLE APPS SCRIPT COM FILA SERIALIZADA E PROTEÇÃO OFFLINE) ---
  async function pullFromCloud(silent = false) {
    if (!config.url || !config.token) return;
    if (!navigator.onLine) {
      if (!silent) showToast("Modo offline");
      return;
    }

    // Se há alterações feitas offline, envia antes de puxar da planilha
    if (syncDebounceTimer || isSyncInFlight || hasPendingSync || localStorage.getItem("tf_dirty") === "1") {
      clearTimeout(syncDebounceTimer);
      syncDebounceTimer = null;
      hasPendingSync = true;
      await flushCloudSync(false);
    }

    try {
      const res = await fetch(config.url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token: config.token, action: "getAll" })
      });
      const data = await res.json();
      if (data.status === "ok" && Array.isArray(data.tasks)) {
        tasks = data.tasks;
        normalizeStarOrder();
        localStorage.setItem("tf_tasks", JSON.stringify(tasks));
        localStorage.removeItem("tf_dirty");
        renderAll();
        if (document.getElementById("completedModal").classList.contains("open")) {
          renderCompletedModal();
        }
        if (!silent) showToast("Sincronizado");
      } else if (!silent) {
        showToast("Erro: " + (data.message || "Falha ao sincronizar"));
      }
    } catch {
      if (!silent) showToast("Sem conexão (modo offline)");
    }
  }

  function pushToCloud(immediate = false) {
    localStorage.setItem("tf_tasks", JSON.stringify(tasks));
    localStorage.setItem("tf_dirty", "1");
    if (!config.url || !config.token) return;

    hasPendingSync = true;
    clearTimeout(syncDebounceTimer);

    if (immediate) {
      syncDebounceTimer = null;
      flushCloudSync(false);
    } else {
      syncDebounceTimer = setTimeout(() => {
        syncDebounceTimer = null;
        flushCloudSync(false);
      }, 750);
    }
  }

  async function flushCloudSync(useKeepalive) {
    if (!config.url || !config.token || !hasPendingSync) return;
    if (isSyncInFlight && !useKeepalive) return;

    isSyncInFlight = true;
    hasPendingSync = false;

    try {
      const res = await fetch(config.url, {
        method: "POST",
        keepalive: !!useKeepalive,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token: config.token, action: "syncAll", tasks })
      });
      if (res && res.ok && !hasPendingSync) {
        localStorage.removeItem("tf_dirty");
      }
    } catch {
      // Mantém tf_dirty="1" para sincronizar quando voltar a ficar online
      hasPendingSync = true;
    } finally {
      isSyncInFlight = false;
      if (hasPendingSync && !useKeepalive && navigator.onLine) {
        flushCloudSync(false);
      }
    }
  }

  function saveCloudConfig() {
    config.url = document.getElementById("cfgUrl").value.trim();
    config.token = document.getElementById("cfgToken").value.trim();
    localStorage.setItem("tf_config", JSON.stringify(config));
    closeModal("configModal");
    pullFromCloud(false);
  }

  // --- CADASTRO DE NOVA TAREFA (+) ---
  function openCreateModal() {
    document.getElementById("gearMenu").classList.remove("open");
    document.getElementById("newTitle").value = "";
    document.getElementById("newPriority").value = "3";
    document.getElementById("newDue").value = "";
    document.getElementById("newAlertType").value = "none";
    document.getElementById("newAlertTime").value = "";
    document.getElementById("newRecMode").value = "none";
    document.getElementById("newTags").value = "";
    document.getElementById("newNotes").value = "";
    document.getElementById("newAdvancedDetails").open = false;
    toggleNewRecFields();

    const depSel = document.getElementById("newDependsOn");
    depSel.innerHTML = `<option value="">Nenhuma</option>` +
      tasks.filter(t => !t.completed).map(t => `<option value="${t.id}">${escapeHtml(t.title)}</option>`).join("");

    openModal("createModal");
    const box = document.querySelector("#createModal .modal-box");
    if (box) box.scrollTop = 0;
    setTimeout(() => document.getElementById("newTitle").focus(), 50);
  }

  function toggleNewRecFields() {
    const mode = document.getElementById("newRecMode").value;
    document.getElementById("newRecTypeWrap").style.display = mode === "calendar" ? "flex" : "none";
    document.getElementById("newRecIntervalWrap").style.display = mode === "completion" ? "flex" : "none";
  }

  function normalizeStarOrder() {
    const starred = sortStarredTasks(tasks.filter(t => !t.completed && t.isMyDay));
    starred.forEach((t, idx) => { t.focusOrder = idx; });
  }

  function promoteToTopStar(task) {
    task.isMyDay = true;
    task.focusOrder = -1;
    normalizeStarOrder();
  }

  function handleCreateTask(e) {
    e.preventDefault();
    const titleInput = document.getElementById("newTitle");
    const title = titleInput.value.trim();
    if (!title) return;

    titleInput.blur();

    const dueDate = document.getElementById("newDue").value;
    const alertType = document.getElementById("newAlertType").value;
    const alertTime = document.getElementById("newAlertTime").value || (alertType !== "none" ? dueDate : "");

    const task = {
      id: "t_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      title,
      completed: false,
      completedAt: null,
      priority: parseInt(document.getElementById("newPriority").value, 10),
      dueDate,
      isMyDay: false,
      focusOrder: null,
      alertType,
      alertTime,
      alertTriggered: false,
      subtasks: [],
      recurrence: {
        mode: document.getElementById("newRecMode").value,
        type: document.getElementById("newRecType").value,
        interval: parseInt(document.getElementById("newRecInterval").value || 1, 10)
      },
      tags: document.getElementById("newTags").value.split(",").map(s => s.trim().replace(/^#/, "")).filter(Boolean),
      notes: document.getElementById("newNotes").value,
      attachments: [],
      dependsOn: document.getElementById("newDependsOn").value
    };

    tasks.unshift(task);
    closeModal("createModal");
    renderAll();
    pushToCloud();
  }

  // --- AÇÕES ---
  function toggleStar(id, e) {
    e.stopPropagation();
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (t.isMyDay) {
      t.isMyDay = false;
      t.focusOrder = null;
      normalizeStarOrder();
    } else {
      promoteToTopStar(t);
    }
    renderAll();
    pushToCloud();
  }

  function completeFromList(id, e) {
    e.stopPropagation();
    if (toggleCompleteById(id)) {
      showToast("Tarefa concluída");
    }
  }

  function toggleCompleteById(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return false;

    if (!t.completed && isTaskBlocked(t)) {
      const pred = tasks.find(x => x.id === t.dependsOn);
      showToast(`Bloqueada por: "${pred ? pred.title : "tarefa anterior"}"`);
      return false;
    }

    t.completed = !t.completed;
    t.completedAt = t.completed ? new Date().toISOString() : null;
    normalizeStarOrder();

    if (t.completed && t.recurrence && t.recurrence.mode !== "none") {
      spawnNextRecurrence(t);
    }

    renderAll();
    if (document.getElementById("completedModal").classList.contains("open")) {
      renderCompletedModal();
    }
    pushToCloud();
    return true;
  }

  function toggleCompleteFromModal() {
    if (!currentEditId) return;
    clearTimeout(editSaveTimer);
    saveEditChanges();
    const t = tasks.find(x => x.id === currentEditId);
    const wasCompleted = t ? t.completed : false;
    if (toggleCompleteById(currentEditId)) {
      currentEditId = null;
      closeModal("editModal");
      showToast(wasCompleted ? "Tarefa reaberta" : "Tarefa concluída");
    }
  }

  function clearAllCompleted() {
    const doneCount = tasks.filter(t => t.completed).length;
    if (!doneCount) return;
    if (!confirm(`Remover todas as ${doneCount} tarefas concluídas?`)) return;

    tasks = tasks.filter(t => !t.completed);
    renderAll();
    renderCompletedModal();
    pushToCloud();
    showToast("Tarefas concluídas removidas");
  }

  function spawnNextRecurrence(task) {
    const rec = task.recurrence;
    let base = (rec.mode === "calendar" && task.dueDate) ? new Date(task.dueDate) : new Date();
    if (rec.mode === "completion" && task.dueDate) {
      const orig = new Date(task.dueDate);
      base.setHours(orig.getHours(), orig.getMinutes(), 0, 0);
    }

    const next = new Date(base);
    const interval = parseInt(rec.interval || 1, 10);

    if (rec.mode === "completion") next.setDate(next.getDate() + interval);
    else if (rec.type === "daily") next.setDate(next.getDate() + 1);
    else if (rec.type === "weekly") next.setDate(next.getDate() + 7);
    else if (rec.type === "monthly") next.setMonth(next.getMonth() + 1);
    else if (rec.type === "yearly") next.setFullYear(next.getFullYear() + 1);

    const nextDue = toLocalInput(next);
    let nextAlert = "";
    if (task.alertTime && task.dueDate) {
      nextAlert = toLocalInput(new Date(next.getTime() + (new Date(task.alertTime) - new Date(task.dueDate))));
    } else if (task.alertTime) {
      nextAlert = nextDue;
    }

    const clone = JSON.parse(JSON.stringify(task));
    clone.id = "t_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    clone.completed = false;
    clone.completedAt = null;
    clone.dueDate = nextDue;
    clone.alertTime = nextAlert;
    clone.alertTriggered = false;
    clone.subtasks = (clone.subtasks || []).map(s => ({ ...s, completed: false }));

    tasks.unshift(clone);
    if (clone.isMyDay) normalizeStarOrder();
    showToast(`Próxima ocorrência: ${formatDate(nextDue)}`);
  }

  // --- ORDENAÇÃO & RENDERIZAÇÃO ---
  function isTaskBlocked(t) {
    if (!t.dependsOn) return false;
    const pred = tasks.find(x => x.id === t.dependsOn);
    return pred ? !pred.completed : false;
  }

  function sortByPriorityAndDue(list) {
    return [...list].sort((a, b) => {
      if (a.priority !== b.priority) return a.priority - b.priority;
      if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
      if (a.dueDate) return -1;
      if (b.dueDate) return 1;
      return 0;
    });
  }

  function sortStarredTasks(list) {
    return [...list].sort((a, b) => {
      const aHas = typeof a.focusOrder === "number";
      const bHas = typeof b.focusOrder === "number";
      if (aHas && bHas && a.focusOrder !== b.focusOrder) return a.focusOrder - b.focusOrder;
      if (aHas && !bHas) return -1;
      if (!aHas && bHas) return 1;
      if (a.priority !== b.priority) return a.priority - b.priority;
      if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
      if (a.dueDate) return -1;
      if (b.dueDate) return 1;
      return 0;
    });
  }

  function renderAll() {
    const starredTasks = sortStarredTasks(tasks.filter(t => !t.completed && t.isMyDay));
    const regularTasks = sortByPriorityAndDue(tasks.filter(t => !t.completed && !t.isMyDay));
    const allActive = [...starredTasks, ...regularTasks];
    const doneCount = tasks.filter(t => t.completed).length;

    document.getElementById("menuCompletedCount").textContent = doneCount;

    const todayLocalStr = toLocalInput(new Date()).slice(0, 10);
    const nowMs = Date.now();

    document.getElementById("taskList").innerHTML = allActive.length
      ? allActive.map(t => renderRow(t, !!t.isMyDay, todayLocalStr, nowMs)).join("")
      : `<div class="empty-msg">Nenhuma tarefa pendente</div>`;
  }

  function renderCompletedModal() {
    const doneTasks = tasks.filter(t => t.completed);
    document.getElementById("completedModalTitle").textContent = `Concluídas (${doneTasks.length})`;
    document.getElementById("clearCompletedBtn").style.display = doneTasks.length ? "inline-block" : "none";
    document.getElementById("completedList").innerHTML = doneTasks.length
      ? doneTasks.map(t => renderCompletedRow(t)).join("")
      : `<div class="empty-msg">Nenhuma tarefa concluída</div>`;
  }

  function renderRow(t, isStarred, todayLocalStr, nowMs) {
    const blocked = isTaskBlocked(t);
    const pred = blocked ? tasks.find(x => x.id === t.dependsOn) : null;
    const metas = [];

    if (blocked) metas.push(`<span class="meta-blocked">Bloqueada: ${escapeHtml(pred ? pred.title : "anterior")}</span>`);
    if (t.dueDate) {
      const isToday = t.dueDate.slice(0, 10) === todayLocalStr;
      const isOverdue = !t.completed && new Date(t.dueDate).getTime() < nowMs;
      const cls = isOverdue ? "meta-overdue" : (isToday ? "meta-today" : "");
      metas.push(`<span class="${cls}">${formatDate(t.dueDate)}</span>`);
    }
    if (t.subtasks && t.subtasks.length > 0) {
      const done = t.subtasks.filter(s => s.completed).length;
      metas.push(`<span>${done}/${t.subtasks.length}</span>`);
    }
    if (t.alertType === "alarm") metas.push(`<span>Alarme</span>`);
    else if (t.alertType === "notification") metas.push(`<span>Alerta</span>`);
    if (t.recurrence && t.recurrence.mode !== "none") metas.push(`<span>Recorrente</span>`);
    if (t.attachments && t.attachments.length) metas.push(`<span>${t.attachments.length} anexo(s)</span>`);
    if (t.notes) metas.push(`<span>Nota</span>`);
    (t.tags || []).forEach(tag => metas.push(`<span class="meta-tag">#${escapeHtml(tag)}</span>`));

    const prioBarHtml = (!t.completed && (t.priority === 1 || t.priority === 2))
      ? `<span class="prio-bar p-${t.priority}"></span>`
      : "";

    const dragAttrs = isStarred
      ? `draggable="true"
         data-starred="true"
         data-id="${t.id}"
         ondragstart="onDragStart(event, '${t.id}')"
         ondragover="onDragOver(event, '${t.id}')"
         ondrop="onDrop(event)"
         ondragend="onDragEnd()"
         ontouchstart="onRowTouchStart(event, '${t.id}')"
         ontouchmove="onRowTouchMove(event)"
         ontouchend="onRowTouchEnd()"
         ontouchcancel="onRowTouchEnd()"`
      : `data-id="${t.id}"`;

    const starSvg = isStarred
      ? `<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
           <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
         </svg>`
      : `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
           <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
         </svg>`;

    return `
      <div class="task-row ${blocked ? "blocked" : ""}" ${dragAttrs}>
        ${prioBarHtml}
        <button type="button" class="check-btn" onclick="completeFromList('${t.id}', event)" title="Concluir tarefa" aria-label="Concluir tarefa">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
        <div class="task-content" onclick="handleTaskClick('${t.id}')">
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-submeta">${metas.join(" · ")}</div>
        </div>
        <button type="button" class="star-btn ${isStarred ? "active" : ""}" onclick="toggleStar('${t.id}', event)" title="${isStarred ? "Remover destaque" : "Destacar no topo"}">
          ${starSvg}
        </button>
      </div>
    `;
  }

  function renderCompletedRow(t) {
    return `
      <div class="task-row completed" data-id="${t.id}">
        <div class="task-content" onclick="openEditModal('${t.id}')">
          <div class="task-title">${escapeHtml(t.title)}</div>
          ${t.completedAt ? `<div class="task-submeta">Concluída em ${formatDate(t.completedAt)}</div>` : ""}
        </div>
        <button type="button" class="btn" style="padding:4px 10px; font-size:0.78rem;" onclick="toggleCompleteById('${t.id}')" title="Reabrir tarefa">
          Reabrir
        </button>
      </div>
    `;
  }

  function handleTaskClick(id) {
    if (justDragged) return;
    openEditModal(id);
  }

  // --- DRAG & DROP OTIMIZADO (CACHE DE MÉTRICAS + rAF) ---
  function cacheStarredMetrics() {
    dragRowMetrics = [];
    document.querySelectorAll('#taskList .task-row[data-starred="true"]').forEach(el => {
      const rect = el.getBoundingClientRect();
      dragRowMetrics.push({
        id: el.dataset.id,
        el,
        top: rect.top,
        bottom: rect.bottom,
        midY: rect.top + rect.height / 2
      });
    });
  }

  function clearDragIndicators() {
    document.querySelectorAll("#taskList .task-row").forEach(el => {
      el.classList.remove("drag-over-top", "drag-over-bottom", "dragging");
    });
  }

  function updateDragVisuals() {
    dragRafPending = false;
    if (!draggedTaskId) return;

    dropTargetId = null;
    for (const item of dragRowMetrics) {
      item.el.classList.remove("drag-over-top", "drag-over-bottom");
      if (item.id === draggedTaskId) continue;
      if (lastPointerY >= item.top && lastPointerY <= item.bottom) {
        dropTargetId = item.id;
        dropInsertAfter = lastPointerY > item.midY;
        item.el.classList.add(dropInsertAfter ? "drag-over-bottom" : "drag-over-top");
      }
    }
  }

  function applyFocusReorder(sourceId, targetId, insertAfter) {
    if (!sourceId || !targetId || sourceId === targetId) return;
    const ordered = sortStarredTasks(tasks.filter(t => !t.completed && t.isMyDay));
    const fromIdx = ordered.findIndex(t => t.id === sourceId);
    if (fromIdx === -1) return;

    const [moved] = ordered.splice(fromIdx, 1);
    let toIdx = ordered.findIndex(t => t.id === targetId);
    if (toIdx === -1) return;
    if (insertAfter) toIdx += 1;

    ordered.splice(toIdx, 0, moved);
    ordered.forEach((t, idx) => { t.focusOrder = idx; });

    renderAll();
    pushToCloud();
  }

  // Desktop (Mouse Drag)
  function onDragStart(e, id) {
    if (e.target.closest("button")) {
      e.preventDefault();
      return;
    }
    draggedTaskId = id;
    cacheStarredMetrics();
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", id);
    requestAnimationFrame(() => e.target.classList.add("dragging"));
  }

  function onDragOver(e) {
    e.preventDefault();
    if (!draggedTaskId) return;
    lastPointerY = e.clientY;
    if (!dragRafPending) {
      dragRafPending = true;
      requestAnimationFrame(updateDragVisuals);
    }
  }

  function onDrop(e) {
    e.preventDefault();
    const src = draggedTaskId;
    const tgt = dropTargetId;
    const after = dropInsertAfter;
    clearDragIndicators();
    draggedTaskId = null;
    dropTargetId = null;
    dragRowMetrics = [];
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 220);
    if (src && tgt) applyFocusReorder(src, tgt, after);
  }

  function onDragEnd() {
    clearDragIndicators();
    draggedTaskId = null;
    dropTargetId = null;
    dragRowMetrics = [];
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 220);
  }

  // Mobile / Touch (Segurar apertado por ~280ms e arrastar)
  function onRowTouchStart(e, id) {
    if (e.target.closest("button") || e.touches.length !== 1) return;
    clearTimeout(longPressTimer);
    isTouchDragging = false;
    dropTargetId = null;

    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    const rowEl = e.currentTarget;

    longPressTimer = setTimeout(() => {
      isTouchDragging = true;
      draggedTaskId = id;
      justDragged = true;
      cacheStarredMetrics();
      rowEl.classList.add("dragging");
      if (navigator.vibrate) navigator.vibrate(25);
    }, 280);
  }

  function onRowTouchMove(e) {
    const touch = e.touches[0];
    if (!isTouchDragging) {
      if (Math.abs(touch.clientX - touchStartX) > 8 || Math.abs(touch.clientY - touchStartY) > 8) {
        clearTimeout(longPressTimer);
      }
      return;
    }

    e.preventDefault();
    lastPointerY = touch.clientY;
    if (!dragRafPending) {
      dragRafPending = true;
      requestAnimationFrame(updateDragVisuals);
    }
  }

  function onRowTouchEnd() {
    clearTimeout(longPressTimer);
    if (!isTouchDragging) return;

    const src = draggedTaskId;
    const tgt = dropTargetId;
    const after = dropInsertAfter;

    clearDragIndicators();
    isTouchDragging = false;
    draggedTaskId = null;
    dropTargetId = null;
    dragRowMetrics = [];

    setTimeout(() => { justDragged = false; }, 320);
    if (src && tgt) applyFocusReorder(src, tgt, after);
  }

  // --- EDIÇÃO E DETALHES ---
  function openEditModal(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    currentEditId = id;

    document.getElementById("editTitle").value = t.title;
    document.getElementById("editIsToday").checked = !!t.isMyDay;
    document.getElementById("editPriority").value = t.priority;
    document.getElementById("editDue").value = t.dueDate || "";
    document.getElementById("editAlertType").value = t.alertType || "none";
    document.getElementById("editAlertTime").value = t.alertTime || "";
    document.getElementById("editTags").value = (t.tags || []).join(", ");
    document.getElementById("editNotes").value = t.notes || "";

    const completeBtn = document.getElementById("toggleCompleteBtn");
    if (t.completed) {
      completeBtn.textContent = "Reabrir tarefa";
      completeBtn.className = "btn";
    } else {
      completeBtn.textContent = "Concluir tarefa";
      completeBtn.className = "btn btn-green";
    }

    const depSel = document.getElementById("editDependsOn");
    depSel.innerHTML = `<option value="">Nenhuma</option>` +
      tasks.filter(x => x.id !== t.id && !x.completed).map(x => `<option value="${x.id}">${escapeHtml(x.title)}</option>`).join("");
    depSel.value = t.dependsOn || "";

    const rec = t.recurrence || { mode: "none", type: "daily", interval: 1 };
    document.getElementById("editRecMode").value = rec.mode;
    document.getElementById("editRecType").value = rec.type;
    document.getElementById("editRecInterval").value = rec.interval || 1;
    toggleEditRecFields();

    renderSubtasks(t);
    renderAttachments(t);
    setMdMode("write");
    openModal("editModal");
  }

  function closeEditModal() {
    if (editSaveTimer) {
      clearTimeout(editSaveTimer);
      editSaveTimer = null;
      saveEditChanges();
    }
    currentEditId = null;
    closeModal("editModal");
  }

  function scheduleEditSave() {
    clearTimeout(editSaveTimer);
    editSaveTimer = setTimeout(() => {
      editSaveTimer = null;
      saveEditChanges();
    }, 350);
  }

  function toggleEditRecFields() {
    const mode = document.getElementById("editRecMode").value;
    document.getElementById("editRecTypeWrap").style.display = mode === "calendar" ? "flex" : "none";
    document.getElementById("editRecIntervalWrap").style.display = mode === "completion" ? "flex" : "none";
  }

  function saveEditChanges() {
    const t = tasks.find(x => x.id === currentEditId);
    if (!t) return;

    const wasMyDay = !!t.isMyDay;
    t.title = document.getElementById("editTitle").value.trim() || t.title;
    const nextIsMyDay = document.getElementById("editIsToday").checked;
    if (nextIsMyDay && !wasMyDay) {
      promoteToTopStar(t);
    } else if (!nextIsMyDay && wasMyDay) {
      t.isMyDay = false;
      t.focusOrder = null;
      normalizeStarOrder();
    }

    t.priority = parseInt(document.getElementById("editPriority").value, 10);
    t.dueDate = document.getElementById("editDue").value;
    t.alertType = document.getElementById("editAlertType").value;

    const newAlert = document.getElementById("editAlertTime").value;
    if (newAlert !== t.alertTime) {
      t.alertTime = newAlert;
      t.alertTriggered = false;
    }

    t.dependsOn = document.getElementById("editDependsOn").value;
    t.tags = document.getElementById("editTags").value.split(",").map(s => s.trim().replace(/^#/, "")).filter(Boolean);
    t.notes = document.getElementById("editNotes").value;
    t.recurrence = {
      mode: document.getElementById("editRecMode").value,
      type: document.getElementById("editRecType").value,
      interval: parseInt(document.getElementById("editRecInterval").value || 1, 10)
    };

    renderAll();
    pushToCloud();
  }

  function deleteTask() {
    if (!currentEditId) return;
    clearTimeout(editSaveTimer);
    editSaveTimer = null;
    tasks = tasks.filter(x => x.id !== currentEditId);
    currentEditId = null;
    normalizeStarOrder();
    closeModal("editModal");
    renderAll();
    if (document.getElementById("completedModal").classList.contains("open")) {
      renderCompletedModal();
    }
    pushToCloud();
  }

  // --- SUBTAREFAS ---
  function renderSubtasks(t) {
    document.getElementById("subtasksList").innerHTML = (t.subtasks || []).map((s, idx) => `
      <div class="item-chip">
        <label class="check-inline" style="flex:1;">
          <input type="checkbox" ${s.completed ? "checked" : ""} onchange="toggleSub(${idx})" />
          <span style="${s.completed ? "text-decoration:line-through;opacity:0.6;" : ""}">${escapeHtml(s.title)}</span>
        </label>
        <button type="button" class="close-x" onclick="removeSub(${idx})">✕</button>
      </div>
    `).join("");
  }

  function addSubtask() {
    const inp = document.getElementById("newSubInput");
    const t = tasks.find(x => x.id === currentEditId);
    if (!inp.value.trim() || !t) return;
    t.subtasks = t.subtasks || [];
    t.subtasks.push({ id: Date.now(), title: inp.value.trim(), completed: false });
    inp.value = "";
    renderSubtasks(t);
    renderAll();
    pushToCloud();
  }

  function toggleSub(idx) {
    const t = tasks.find(x => x.id === currentEditId);
    if (!t || !t.subtasks[idx]) return;
    t.subtasks[idx].completed = !t.subtasks[idx].completed;
    renderSubtasks(t);
    renderAll();
    pushToCloud();
  }

  function removeSub(idx) {
    const t = tasks.find(x => x.id === currentEditId);
    if (!t) return;
    t.subtasks.splice(idx, 1);
    renderSubtasks(t);
    renderAll();
    pushToCloud();
  }

  // --- MARKDOWN ---
  function setMdMode(mode) {
    const ta = document.getElementById("editNotes");
    const prev = document.getElementById("editNotesPreview");
    document.getElementById("btnMdWrite").classList.toggle("active", mode === "write");
    document.getElementById("btnMdRead").classList.toggle("active", mode === "read");

    if (mode === "write") {
      ta.style.display = "block";
      prev.style.display = "none";
    } else {
      if (editSaveTimer) {
        clearTimeout(editSaveTimer);
        editSaveTimer = null;
        saveEditChanges();
      }
      ta.style.display = "none";
      prev.style.display = "block";
      prev.innerHTML = renderMarkdown(ta.value);
    }
  }

  function renderMarkdown(md) {
    if (!md) return `<span style="color:var(--text-muted)">Sem notas.</span>`;
    let html = escapeHtml(md);
    html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) =>
      `<a href="${sanitizeUrl(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`
    );
    html = html.replace(/^\s*-\s+(.*)$/gm, "<li>$1</li>");
    html = html.replace(/(<li>.*<\/li>)/s, "<ul>$1</ul>");
    return html.replace(/\n/g, "<br>");
  }

  // --- ANEXOS (GOOGLE DRIVE) ---
  function renderAttachments(t) {
    document.getElementById("attachmentsList").innerHTML = (t.attachments || []).map((a, idx) => `
      <div class="item-chip">
        <a href="${sanitizeUrl(a.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          ${escapeHtml(a.name)}
        </a>
        <button type="button" class="close-x" onclick="removeAttachment(${idx})">✕</button>
      </div>
    `).join("");
  }

  function uploadAttachment(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!config.url || !config.token) {
      showToast("Configure a Nuvem primeiro");
      e.target.value = "";
      return;
    }
    if (!navigator.onLine) {
      showToast("Anexos requerem internet");
      e.target.value = "";
      return;
    }
    const msg = document.getElementById("uploadMsg");
    msg.textContent = "Enviando para o Google Drive...";

    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const res = await fetch(config.url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            token: config.token,
            action: "uploadFile",
            fileName: file.name,
            mimeType: file.type || "application/octet-stream",
            base64Data: reader.result.split(",")[1]
          })
        });
        const data = await res.json();
        if (data.status === "ok" && data.file) {
          const t = tasks.find(x => x.id === currentEditId);
          if (t) {
            t.attachments = t.attachments || [];
            t.attachments.push(data.file);
            renderAttachments(t);
            renderAll();
            pushToCloud();
          }
          msg.textContent = "Salvo no Drive";
        } else {
          msg.textContent = "Erro ao enviar.";
        }
      } catch {
        msg.textContent = "Falha de conexão.";
      }
      e.target.value = "";
    };
    reader.readAsDataURL(file);
  }

  function removeAttachment(idx) {
    const t = tasks.find(x => x.id === currentEditId);
    if (!t) return;
    t.attachments.splice(idx, 1);
    renderAttachments(t);
    renderAll();
    pushToCloud();
  }

  // --- ALERTAS & DESPERTADOR ---
  function checkAlerts() {
    const nowMs = Date.now();
    let changed = false;

    for (const t of tasks) {
      if (t.completed || t.alertTriggered || t.alertType === "none" || !t.alertTime) continue;
      if (nowMs >= new Date(t.alertTime).getTime()) {
        t.alertTriggered = true;
        changed = true;
        if (t.alertType === "notification") {
          showToast(t.title);
          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("Lembrete", { body: t.title });
          }
        } else if (t.alertType === "alarm") {
          triggerAlarm(t);
        }
      }
    }

    if (changed) pushToCloud(true);
  }

  function triggerAlarm(task) {
    activeAlarmId = task.id;
    document.getElementById("alarmTitle").textContent = task.title;
    document.getElementById("alarmDue").textContent = task.dueDate ? `Prazo: ${formatDate(task.dueDate)}` : "";
    openModal("alarmModal");

    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Despertador: " + task.title, { requireInteraction: true });
    }

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    stopAlarmBeep();

    const beep = () => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.45);
      osc.onended = () => { osc.disconnect(); gain.disconnect(); };
    };
    beep();
    alarmTimer = setInterval(beep, 1200);
  }

  function stopAlarmBeep() {
    if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
  }

  function snoozeAlarm(mins) {
    stopAlarmBeep();
    closeModal("alarmModal");
    const t = tasks.find(x => x.id === activeAlarmId);
    if (t) {
      t.alertTime = toLocalInput(new Date(Date.now() + mins * 60000));
      t.alertTriggered = false;
      pushToCloud(true);
      showToast(`Adiado por ${mins} min`);
    }
    activeAlarmId = null;
  }

  function dismissAlarm() {
    stopAlarmBeep();
    closeModal("alarmModal");
    activeAlarmId = null;
  }

  // --- AUXILIARES ---
  function openModal(id) { document.getElementById(id).classList.add("open"); }
  function closeModal(id) { document.getElementById(id).classList.remove("open"); }
  function closeOnBackdrop(e, id) {
    if (e.target.id !== id) return;
    if (id === "editModal") closeEditModal();
    else closeModal(id);
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " +
           d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function toLocalInput(date) {
    const p = n => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`;
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  function sanitizeUrl(url) {
    const clean = String(url || "").trim();
    return /^https?:\/\//i.test(clean) ? escapeHtml(clean) : "#";
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = "none"; }, 3000);
  }
</script>
