<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foco Agora</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131926;
      --surface-hover: #1a2234;
      --border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --green: #16a34a;
      --green-hover: #15803d;
      --primary: #3b82f6;
      --myday: #f59e0b;
      --p1: #ef4444;
      --p2: #f97316;
      --p3: #3b82f6;
      --p4: #4b5563;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Topo com "Foco Agora" centralizado na mesma linha dos botões */
    header {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 18px 14px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .header-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .focus-heading {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--myday);
      letter-spacing: -0.01em;
    }

    .header-count {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
      display: inline-block;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .status-dot.ok { background: #22c55e; }
    .status-dot.syncing { background: #f59e0b; }
    .status-dot.err { background: #ef4444; }

    .top-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
    }
    .icon-btn:hover { background: var(--surface-hover); }

    .icon-btn.btn-add {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      font-size: 1.45rem;
      font-weight: 500;
      line-height: 1;
    }
    .icon-btn.btn-add:hover { background: var(--green-hover); }

    /* Menu Dropdown da Engrenagem */
    .gear-menu {
      position: absolute;
      top: 46px;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 165px;
      padding: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 40;
    }
    .gear-menu.open { display: flex; }

    .gear-menu button {
      background: transparent;
      border: none;
      color: var(--text);
      text-align: left;
      padding: 10px 12px;
      border-radius: 7px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gear-menu button:hover { background: var(--surface-hover); }

    /* Área Principal */
    main {
      max-width: 720px;
      margin: 6px auto;
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .list-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Botão de colapsar/expandir (Tarefas e Concluídas) */
    .section-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      transition: color 0.15s;
    }
    .section-toggle:hover { color: var(--text); }

    .completed-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.83rem;
      cursor: pointer;
      align-self: flex-start;
      padding: 4px 2px;
      transition: color 0.15s;
    }
    .completed-toggle:hover { color: var(--text); }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-msg {
      color: #4b5563;
      font-size: 0.88rem;
      padding: 6px 2px;
    }

    /* Cartão de Tarefa */
    .task-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--p4);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .task-row:hover {
      background: var(--surface-hover);
      border-color: #374151;
    }
    .task-row.p-1 { border-left-color: var(--p1); }
    .task-row.p-2 { border-left-color: var(--p2); }
    .task-row.p-3 { border-left-color: var(--p3); }
    .task-row.p-4 { border-left-color: var(--p4); }
    .task-row.blocked { opacity: 0.7; border-style: dashed; }
    .task-row.completed { opacity: 0.5; }
    .task-row.completed .task-title { text-decoration: line-through; }

    /* Alça e estados de Drag & Drop (Foco Agora) */
    .drag-handle {
      color: #4b5563;
      cursor: grab;
      font-size: 1rem;
      line-height: 1;
      padding: 4px 2px;
      user-select: none;
      touch-action: none;
      flex-shrink: 0;
      letter-spacing: -2px;
    }
    .drag-handle:hover { color: var(--text-muted); }
    .drag-handle:active { cursor: grabbing; }

    .task-row.dragging {
      opacity: 0.4;
      border-color: var(--myday);
    }
    .task-row.drag-over-top {
      border-top: 2px solid var(--myday);
    }
    .task-row.drag-over-bottom {
      border-bottom: 2px solid var(--myday);
    }

    .task-check {
      width: 19px;
      height: 19px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-content {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .task-title {
      font-size: 0.96rem;
      font-weight: 500;
      word-break: break-word;
    }

    .task-submeta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 3px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }
    .task-submeta:empty { display: none; }

    .meta-overdue { color: #f87171; font-weight: 500; }
    .meta-today { color: #fbbf24; }
    .meta-blocked { color: #fca5a5; }
    .meta-tag { color: #60a5fa; }

    .star-btn {
      background: transparent;
      border: none;
      color: #4b5563;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .star-btn:hover { color: var(--text-muted); }
    .star-btn.active { color: var(--myday); }

    /* Modais */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.05rem; font-weight: 600; }

    .close-x {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .close-x:hover { color: var(--text); }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    input[type="text"], input[type="number"], input[type="datetime-local"], select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea { min-height: 95px; resize: vertical; }

    .check-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    details.advanced-box {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    details.advanced-box summary {
      font-size: 0.83rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      margin-bottom: 10px;
    }
    .advanced-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 4px;
    }

    .btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #263147; }
    .btn-green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-green:hover { background: var(--green-hover); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-danger { background: rgba(239, 68, 68, 0.12); border-color: var(--danger); color: #fca5a5; }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    /* Subtarefas, Markdown e Anexos */
    .item-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.85rem;
      gap: 8px;
    }
    .md-switch { display: flex; gap: 6px; }
    .md-switch button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .md-switch button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .md-view {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      min-height: 95px;
      font-size: 0.88rem;
    }
    .md-view a { color: #60a5fa; }
    .md-view code { background: #1f2937; padding: 2px 5px; border-radius: 4px; }
    .md-view pre { background: #070a12; padding: 8px; border-radius: 6px; overflow-x: auto; margin: 5px 0; }
    .md-view ul { padding-left: 18px; }

    /* Alarme */
    .alarm-box {
      border: 2px solid var(--danger);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.45);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      border: 1px solid #374151;
      color: var(--text);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 90;
      display: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 540px) {
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div></div>

  <div class="header-center">
    <span class="focus-heading">☀️ Foco Agora</span>
    <span id="todayCount" class="header-count">0</span>
    <span id="syncDot" class="status-dot" title="Modo Local"></span>
  </div>

  <div class="top-actions">
    <button type="button" class="icon-btn btn-add" onclick="openCreateModal()" title="Nova Tarefa">+</button>
    <button type="button" id="gearBtn" class="icon-btn" onclick="toggleGearMenu(event)" title="Opções">⚙️</button>

    <div id="gearMenu" class="gear-menu">
      <button type="button" onclick="openConfigFromMenu()">☁️ Nuvem</button>
      <button type="button" onclick="syncFromMenu()">🔄 Sincronizar</button>
    </div>
  </div>
</header>

<main>
  <!-- Lista: Foco Agora (com reordenação por arrastar e soltar) -->
  <section class="list-section">
    <div id="todayList" class="task-list"></div>
  </section>

  <!-- Lista: Tarefas (colapsável) -->
  <section class="list-section">
    <button type="button" id="toggleTasksBtn" class="section-toggle" onclick="toggleShowTasks()">
      ▾ Tarefas (0)
    </button>
    <div id="generalList" class="task-list"></div>
  </section>

  <!-- Lista: Concluídas (colapsável) -->
  <div id="completedArea" style="display:none; flex-direction:column; gap:10px;">
    <button type="button" id="toggleCompletedBtn" class="completed-toggle" onclick="toggleShowCompleted()">
      ▸ Mostrar concluídas (0)
    </button>
    <div id="completedList" class="task-list" style="display:none;"></div>
  </div>
</main>

<!-- Modal: Nova Tarefa (+) -->
<div id="createModal" class="modal-backdrop" onclick="closeOnBackdrop(event, 'createModal')">
  <form class="modal-box" onsubmit="handleCreateTask(event)">
    <div class="modal-header">
      <h3>Nova Tarefa</h3>
      <button type="button" class="close-x" onclick="closeModal('createModal')">✕</button>
    </div>

    <div class="field">
      <label>Título</label>
      <input type="text" id="newTitle" placeholder="O que precisa ser feito?" required />
    </div>

    <div class="field-row">
      <div class="field">
        <label>Prioridade</label>
        <select id="newPriority">
          <option value="1">🔴 P1 - Urgente</option>
          <option value="2">🟠 P2 - Alta</option>
          <option value="3" selected>🔵 P3 - Média</option>
          <option value="4">⚪ P4 - Baixa</option>
        </select>
      </div>
      <div class="field">
        <label>Prazo</label>
        <input type="datetime-local" id="newDue" />
      </div>
    </div>

    <label class="check-inline">
      <input type="checkbox" id="newIsToday" checked /> Adicionar em <strong>Foco Agora</strong>
    </label>

    <details class="advanced-box">
      <summary>+ Mais detalhes (Alerta, Recorrência, Dependência, Tags, Notas)</summary>
      <div class="advanced-fields">
        <div class="field-row">
          <div class="field">
            <label>Alerta / Despertador</label>
            <select id="newAlertType">
              <option value="none">Sem alerta</option>
              <option value="notification">🔔 Notificação</option>
              <option value="alarm">⏰ Despertador sonoro</option>
            </select>
          </div>
          <div class="field">
            <label>Horário do Alerta</label>
            <input type="datetime-local" id="newAlertTime" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Recorrência</label>
            <select id="newRecMode" onchange="toggleNewRecFields()">
              <option value="none">Não se repete</option>
              <option value="calendar">Por calendário</option>
              <option value="completion">Dias após conclusão</option>
            </select>
          </div>
          <div class="field" id="newRecTypeWrap" style="display:none;">
            <label>Frequência</label>
            <select id="newRecType">
              <option value="daily">Diária</option>
              <option value="weekly">Semanal</option>
              <option value="monthly">Mensal</option>
              <option value="yearly">Anual</option>
            </select>
          </div>
          <div class="field" id="newRecIntervalWrap" style="display:none;">
            <label>Dias após concluir</label>
            <input type="number" id="newRecInterval" min="1" value="1" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Bloqueada por</label>
            <select id="newDependsOn">
              <option value="">Nenhuma</option>
            </select>
          </div>
          <div class="field">
            <label>Etiquetas (vírgula)</label>
            <input type="text" id="newTags" placeholder="trabalho, casa" />
          </div>
        </div>

        <div class="field">
          <label>Notas (Markdown)</label>
          <textarea id="newNotes" placeholder="Detalhes, links ou passos..."></textarea>
        </div>
      </div>
    </details>

    <div class="modal-footer">
      <button type="button" class="btn" onclick="closeModal('createModal')">Cancelar</button>
      <button type="submit" class="btn btn-green">Salvar Tarefa</button>
    </div>
  </form>
</div>

<!-- Modal: Editar / Detalhes da Tarefa -->
<div id="editModal" class="modal-backdrop" onclick="closeOnBackdrop(event, 'editModal')">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Detalhes da Tarefa</h3>
      <button type="button" class="close-x" onclick="closeModal('editModal')">✕</button>
    </div>

    <div class="field">
      <label>Título</label>
      <input type="text" id="editTitle" onchange="saveEditChanges()" />
    </div>

    <label class="check-inline">
      <input type="checkbox" id="editIsToday" onchange="saveEditChanges()" /> Exibir em <strong>Foco Agora</strong>
    </label>

    <div class="field-row">
      <div class="field">
        <label>Prioridade</label>
        <select id="editPriority" onchange="saveEditChanges()">
          <option value="1">🔴 P1 - Urgente</option>
          <option value="2">🟠 P2 - Alta</option>
          <option value="3">🔵 P3 - Média</option>
          <option value="4">⚪ P4 - Baixa</option>
        </select>
      </div>
      <div class="field">
        <label>Prazo</label>
        <input type="datetime-local" id="editDue" onchange="saveEditChanges()" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Tipo de Alerta</label>
        <select id="editAlertType" onchange="saveEditChanges()">
          <option value="none">Sem alerta</option>
          <option value="notification">🔔 Notificação</option>
          <option value="alarm">⏰ Despertador sonoro</option>
        </select>
      </div>
      <div class="field">
        <label>Horário do Alerta</label>
        <input type="datetime-local" id="editAlertTime" onchange="saveEditChanges()" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Bloqueada por</label>
        <select id="editDependsOn" onchange="saveEditChanges()">
          <option value="">Nenhuma</option>
        </select>
      </div>
      <div class="field">
        <label>Etiquetas</label>
        <input type="text" id="editTags" placeholder="ex: trabalho, urgente" onchange="saveEditChanges()" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Recorrência</label>
        <select id="editRecMode" onchange="toggleEditRecFields(); saveEditChanges();">
          <option value="none">Não se repete</option>
          <option value="calendar">Por calendário</option>
          <option value="completion">Dias após conclusão</option>
        </select>
      </div>
      <div class="field" id="editRecTypeWrap" style="display:none;">
        <label>Frequência</label>
        <select id="editRecType" onchange="saveEditChanges()">
          <option value="daily">Diária</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensal</option>
          <option value="yearly">Anual</option>
        </select>
      </div>
      <div class="field" id="editRecIntervalWrap" style="display:none;">
        <label>Dias após concluir</label>
        <input type="number" id="editRecInterval" min="1" value="1" onchange="saveEditChanges()" />
      </div>
    </div>

    <!-- Subtarefas -->
    <div class="field">
      <label>Subtarefas</label>
      <div style="display:flex; gap:6px;">
        <input type="text" id="newSubInput" placeholder="Nova subtarefa..." onkeydown="if(event.key==='Enter'){event.preventDefault();addSubtask();}" />
        <button type="button" class="btn" onclick="addSubtask()">+</button>
      </div>
      <div id="subtasksList" style="display:flex; flex-direction:column; gap:5px; margin-top:5px;"></div>
    </div>

    <!-- Notas Markdown -->
    <div class="field">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label>Notas (Markdown)</label>
        <div class="md-switch">
          <button type="button" id="btnMdWrite" class="active" onclick="setMdMode('write')">Editar</button>
          <button type="button" id="btnMdRead" onclick="setMdMode('read')">Visualizar</button>
        </div>
      </div>
      <textarea id="editNotes" onchange="saveEditChanges()"></textarea>
      <div id="editNotesPreview" class="md-view" style="display:none;"></div>
    </div>

    <!-- Anexos Google Drive -->
    <div class="field">
      <label>Anexos (Google Drive)</label>
      <input type="file" id="editFileInput" onchange="uploadAttachment(event)" />
      <small id="uploadMsg" style="color:var(--myday);"></small>
      <div id="attachmentsList" style="display:flex; flex-direction:column; gap:5px; margin-top:5px;"></div>
    </div>

    <div class="modal-footer" style="justify-content:space-between; border-top:1px solid var(--border); padding-top:12px;">
      <button type="button" class="btn btn-danger" onclick="deleteTask()">Excluir</button>
      <button type="button" class="btn btn-primary" onclick="closeModal('editModal')">Concluir</button>
    </div>
  </div>
</div>

<!-- Modal: Configuração da Nuvem -->
<div id="configModal" class="modal-backdrop" onclick="closeOnBackdrop(event, 'configModal')">
  <div class="modal-box">
    <div class="modal-header">
      <h3>☁️ Configuração da Nuvem</h3>
      <button type="button" class="close-x" onclick="closeModal('configModal')">✕</button>
    </div>
    <div class="field">
      <label>URL do Web App (Google Apps Script)</label>
      <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" />
    </div>
    <div class="field">
      <label>Token Secreto</label>
      <input type="text" id="cfgToken" placeholder="Sua senha configurada no script" />
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" onclick="closeModal('configModal')">Cancelar</button>
      <button type="button" class="btn btn-green" onclick="saveCloudConfig()">Salvar e Sincronizar</button>
    </div>
  </div>
</div>

<!-- Modal: Despertador Sonoro -->
<div id="alarmModal" class="modal-backdrop">
  <div class="modal-box alarm-box">
    <div style="color:#fca5a5; font-weight:700; font-size:1.1rem;">⏰ DESPERTADOR</div>
    <div id="alarmTitle" style="font-size:1.15rem; font-weight:600;"></div>
    <div id="alarmDue" style="font-size:0.85rem; color:var(--text-muted);"></div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
      <button type="button" class="btn" onclick="snoozeAlarm(5)">Adiar 5 min</button>
      <button type="button" class="btn" onclick="snoozeAlarm(15)">Adiar 15 min</button>
      <button type="button" class="btn btn-green" onclick="dismissAlarm()">Dispensar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tf_tasks") || "[]");
  let config = JSON.parse(localStorage.getItem("tf_config") || '{"url":"","token":""}');
  let currentEditId = null;
  let showTasks = true;
  let showCompleted = false;
  let audioCtx = null;
  let alarmTimer = null;
  let activeAlarmId = null;

  // Estado de Drag & Drop (Foco Agora)
  let draggedTaskId = null;
  let dropTargetId = null;
  let dropInsertAfter = false;

  window.addEventListener("DOMContentLoaded", () => {
    renderAll();
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
    if (config.url && config.token) {
      pullFromCloud();
    }
    setInterval(checkAlerts, 10000);
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#gearBtn") && !e.target.closest("#gearMenu")) {
        document.getElementById("gearMenu").classList.remove("open");
      }
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    });
  });

  // --- MENU ENGRENAGEM ---
  function toggleGearMenu(e) {
    e.stopPropagation();
    document.getElementById("gearMenu").classList.toggle("open");
  }

  function openConfigFromMenu() {
    document.getElementById("gearMenu").classList.remove("open");
    document.getElementById("cfgUrl").value = config.url || "";
    document.getElementById("cfgToken").value = config.token || "";
    openModal("configModal");
  }

  function syncFromMenu() {
    document.getElementById("gearMenu").classList.remove("open");
    if (!config.url || !config.token) return openConfigFromMenu();
    pullFromCloud();
  }

  // --- NUVEM (GOOGLE APPS SCRIPT) ---
  function setSyncDot(state, title) {
    const dot = document.getElementById("syncDot");
    dot.className = "status-dot " + state;
    dot.title = title;
  }

  async function pullFromCloud() {
    if (!config.url || !config.token) return;
    setSyncDot("syncing", "Sincronizando...");
    try {
      const res = await fetch(config.url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token: config.token, action: "getAll" })
      });
      const data = await res.json();
      if (data.status === "ok" && Array.isArray(data.tasks)) {
        tasks = data.tasks;
        localStorage.setItem("tf_tasks", JSON.stringify(tasks));
        renderAll();
        setSyncDot("ok", "Sincronizado");
        showToast("Sincronizado ✓");
      } else {
        setSyncDot("err", data.message || "Erro na nuvem");
        showToast("Erro: " + (data.message || "Falha ao sincronizar"));
      }
    } catch (err) {
      setSyncDot("err", "Offline");
      showToast("Sem conexão (modo local)");
    }
  }

  async function pushToCloud() {
    localStorage.setItem("tf_tasks", JSON.stringify(tasks));
    if (!config.url || !config.token) {
      setSyncDot("", "Modo Local");
      return;
    }
    setSyncDot("syncing", "Salvando...");
    try {
      const res = await fetch(config.url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token: config.token, action: "syncAll", tasks })
      });
      const data = await res.json();
      setSyncDot(data.status === "ok" ? "ok" : "err", data.status === "ok" ? "Sincronizado" : "Erro ao salvar");
    } catch (err) {
      setSyncDot("err", "Offline");
    }
  }

  function saveCloudConfig() {
    config.url = document.getElementById("cfgUrl").value.trim();
    config.token = document.getElementById("cfgToken").value.trim();
    localStorage.setItem("tf_config", JSON.stringify(config));
    closeModal("configModal");
    pullFromCloud();
  }

  // --- CADASTRO DE NOVA TAREFA (+) ---
  function openCreateModal() {
    document.getElementById("newTitle").value = "";
    document.getElementById("newPriority").value = "3";
    document.getElementById("newDue").value = "";
    document.getElementById("newIsToday").checked = true;
    document.getElementById("newAlertType").value = "none";
    document.getElementById("newAlertTime").value = "";
    document.getElementById("newRecMode").value = "none";
    document.getElementById("newTags").value = "";
    document.getElementById("newNotes").value = "";
    toggleNewRecFields();

    const depSel = document.getElementById("newDependsOn");
    depSel.innerHTML = `<option value="">Nenhuma</option>` +
      tasks.filter(t => !t.completed).map(t => `<option value="${t.id}">${escapeHtml(t.title)}</option>`).join("");

    openModal("createModal");
    setTimeout(() => document.getElementById("newTitle").focus(), 60);
  }

  function toggleNewRecFields() {
    const mode = document.getElementById("newRecMode").value;
    document.getElementById("newRecTypeWrap").style.display = mode === "calendar" ? "flex" : "none";
    document.getElementById("newRecIntervalWrap").style.display = mode === "completion" ? "flex" : "none";
  }

  function getMinFocusOrder() {
    const orders = tasks
      .filter(t => !t.completed && t.isMyDay && typeof t.focusOrder === "number")
      .map(t => t.focusOrder);
    return orders.length ? Math.min(...orders) - 1 : 0;
  }

  function handleCreateTask(e) {
    e.preventDefault();
    const title = document.getElementById("newTitle").value.trim();
    if (!title) return;

    const dueDate = document.getElementById("newDue").value;
    const alertType = document.getElementById("newAlertType").value;
    const alertTime = document.getElementById("newAlertTime").value || (alertType !== "none" ? dueDate : "");
    const isMyDay = document.getElementById("newIsToday").checked;

    const task = {
      id: "t_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      title,
      completed: false,
      completedAt: null,
      priority: parseInt(document.getElementById("newPriority").value, 10),
      dueDate,
      isMyDay,
      focusOrder: isMyDay ? getMinFocusOrder() : null,
      alertType,
      alertTime,
      alertTriggered: false,
      subtasks: [],
      recurrence: {
        mode: document.getElementById("newRecMode").value,
        type: document.getElementById("newRecType").value,
        interval: parseInt(document.getElementById("newRecInterval").value || 1, 10)
      },
      tags: document.getElementById("newTags").value.split(",").map(s => s.trim().replace(/^#/, "")).filter(Boolean),
      notes: document.getElementById("newNotes").value,
      attachments: [],
      dependsOn: document.getElementById("newDependsOn").value
    };

    tasks.unshift(task);
    closeModal("createModal");
    renderAll();
    pushToCloud();
  }

  // --- AÇÕES RÁPIDAS ---
  function toggleToday(id, e) {
    e.stopPropagation();
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.isMyDay = !t.isMyDay;
    if (t.isMyDay) {
      t.focusOrder = getMinFocusOrder();
    }
    renderAll();
    pushToCloud();
  }

  function toggleComplete(id, e) {
    e.stopPropagation();
    const t = tasks.find(x => x.id === id);
    if (!t) return;

    if (!t.completed && isTaskBlocked(t)) {
      const pred = tasks.find(x => x.id === t.dependsOn);
      showToast(`Bloqueada por: "${pred ? pred.title : "tarefa anterior"}"`);
      renderAll();
      return;
    }

    t.completed = !t.completed;
    t.completedAt = t.completed ? new Date().toISOString() : null;

    if (t.completed && t.recurrence && t.recurrence.mode !== "none") {
      spawnNextRecurrence(t);
    }

    renderAll();
    pushToCloud();
  }

  function spawnNextRecurrence(task) {
    const rec = task.recurrence;
    let base = (rec.mode === "calendar" && task.dueDate) ? new Date(task.dueDate) : new Date();
    if (rec.mode === "completion" && task.dueDate) {
      const orig = new Date(task.dueDate);
      base.setHours(orig.getHours(), orig.getMinutes(), 0, 0);
    }

    const next = new Date(base);
    const interval = parseInt(rec.interval || 1, 10);

    if (rec.mode === "completion") next.setDate(next.getDate() + interval);
    else if (rec.type === "daily") next.setDate(next.getDate() + 1);
    else if (rec.type === "weekly") next.setDate(next.getDate() + 7);
    else if (rec.type === "monthly") next.setMonth(next.getMonth() + 1);
    else if (rec.type === "yearly") next.setFullYear(next.getFullYear() + 1);

    const nextDue = toLocalInput(next);
    let nextAlert = "";
    if (task.alertTime && task.dueDate) {
      nextAlert = toLocalInput(new Date(next.getTime() + (new Date(task.alertTime) - new Date(task.dueDate))));
    } else if (task.alertTime) {
      nextAlert = nextDue;
    }

    const clone = JSON.parse(JSON.stringify(task));
    clone.id = "t_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    clone.completed = false;
    clone.completedAt = null;
    clone.dueDate = nextDue;
    clone.alertTime = nextAlert;
    clone.alertTriggered = false;
    clone.subtasks = (clone.subtasks || []).map(s => ({ ...s, completed: false }));

    tasks.unshift(clone);
    showToast(`Próxima ocorrência: ${formatDate(nextDue)}`);
  }

  // --- ORDENAÇÃO & RENDERIZAÇÃO ---
  function isTaskBlocked(t) {
    if (!t.dependsOn) return false;
    const pred = tasks.find(x => x.id === t.dependsOn);
    return pred ? !pred.completed : false;
  }

  function sortByPriorityAndDue(list) {
    return [...list].sort((a, b) => {
      if (a.priority !== b.priority) return a.priority - b.priority;
      if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
      if (a.dueDate) return -1;
      if (b.dueDate) return 1;
      return 0;
    });
  }

  function sortFocusTasks(list) {
    return [...list].sort((a, b) => {
      const aHas = typeof a.focusOrder === "number";
      const bHas = typeof b.focusOrder === "number";
      if (aHas && bHas && a.focusOrder !== b.focusOrder) return a.focusOrder - b.focusOrder;
      if (aHas && !bHas) return -1;
      if (!aHas && bHas) return 1;
      if (a.priority !== b.priority) return a.priority - b.priority;
      if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
      if (a.dueDate) return -1;
      if (b.dueDate) return 1;
      return 0;
    });
  }

  function renderAll() {
    const todayTasks = sortFocusTasks(tasks.filter(t => !t.completed && t.isMyDay));
    const generalTasks = sortByPriorityAndDue(tasks.filter(t => !t.completed && !t.isMyDay));
    const doneTasks = tasks.filter(t => t.completed);

    // Foco Agora (Topo)
    document.getElementById("todayCount").textContent = todayTasks.length;
    document.getElementById("todayList").innerHTML = todayTasks.length
      ? todayTasks.map(t => renderRow(t, true)).join("")
      : `<div class="empty-msg">Nenhuma tarefa em Foco Agora.</div>`;

    // Tarefas (Colapsável)
    document.getElementById("toggleTasksBtn").textContent =
      `${showTasks ? "▾" : "▸"} Tarefas (${generalTasks.length})`;
    const genList = document.getElementById("generalList");
    genList.style.display = showTasks ? "flex" : "none";
    genList.innerHTML = showTasks
      ? (generalTasks.length
          ? generalTasks.map(t => renderRow(t, false)).join("")
          : `<div class="empty-msg">Nenhuma tarefa pendente.</div>`)
      : "";

    // Concluídas (Colapsável)
    const compArea = document.getElementById("completedArea");
    if (doneTasks.length >
