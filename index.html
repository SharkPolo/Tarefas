<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foco Agora</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131926;
      --surface-hover: #1a2234;
      --border: #1f2937;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --green: #16a34a;
      --green-hover: #15803d;
      --primary: #3b82f6;
      --myday: #f59e0b;
      --p1: #ef4444;
      --p2: #f97316;
      --p3: #3b82f6;
      --p4: #4b5563;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Topo com "Foco Agora" centralizado na mesma linha dos botões */
    header {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 18px 14px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .header-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .focus-heading {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--myday);
      letter-spacing: -0.01em;
    }

    .header-count {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
      display: inline-block;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .status-dot.ok { background: #22c55e; }
    .status-dot.syncing { background: #f59e0b; }
    .status-dot.err { background: #ef4444; }

    .top-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
    }
    .icon-btn:hover { background: var(--surface-hover); }

    .icon-btn.btn-add {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      font-size: 1.45rem;
      font-weight: 500;
      line-height: 1;
    }
    .icon-btn.btn-add:hover { background: var(--green-hover); }

    /* Menu Dropdown da Engrenagem */
    .gear-menu {
      position: absolute;
      top: 46px;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 165px;
      padding: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 40;
    }
    .gear-menu.open { display: flex; }

    .gear-menu button {
      background: transparent;
      border: none;
      color: var(--text);
      text-align: left;
      padding: 10px 12px;
      border-radius: 7px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gear-menu button:hover { background: var(--surface-hover); }

    /* Área Principal */
    main {
      max-width: 720px;
      margin: 6px auto;
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .list-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Botão de colapsar/expandir (Tarefas e Concluídas) */
    .section-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      transition: color 0.15s;
    }
    .section-toggle:hover { color: var(--text); }

    .completed-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.83rem;
      cursor: pointer;
      align-self: flex-start;
      padding: 4px 2px;
      transition: color 0.15s;
    }
    .completed-toggle:hover { color: var(--text); }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-msg {
      color: #4b5563;
      font-size: 0.88rem;
      padding: 6px 2px;
    }

    /* Cartão de Tarefa */
    .task-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--p4);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .task-row:hover {
      background: var(--surface-hover);
      border-color: #374151;
    }
    .task-row.p-1 { border-left-color: var(--p1); }
    .task-row.p-2 { border-left-color: var(--p2); }
    .task-row.p-3 { border-left-color: var(--p3); }
    .task-row.p-4 { border-left-color: var(--p4); }
    .task-row.blocked { opacity: 0.7; border-style: dashed; }
    .task-row.completed { opacity: 0.5; }
    .task-row.completed .task-title { text-decoration: line-through; }

    /* Alça e estados de Drag & Drop (Foco Agora) */
    .drag-handle {
      color: #4b5563;
      cursor: grab;
      font-size: 1rem;
      line-height: 1;
      padding: 4px 2px;
      user-select: none;
      touch-action: none;
      flex-shrink: 0;
      letter-spacing: -2px;
    }
    .drag-handle:hover { color: var(--text-muted); }
    .drag-handle:active { cursor: grabbing; }

    .task-row.dragging {
      opacity: 0.4;
      border-color: var(--myday);
    }
    .task-row.drag-over-top {
      border-top: 2px solid var(--myday);
    }
    .task-row.drag-over-bottom {
      border-bottom: 2px solid var(--myday);
    }

    .task-check {
      width: 19px;
      height: 19px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-content {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .task-title {
      font-size: 0.96rem;
      font-weight: 500;
      word-break: break-word;
    }

    .task-submeta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 3px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }
    .task-submeta:empty { display: none; }

    .meta-overdue { color: #f87171; font-weight: 500; }
    .meta-today { color: #fbbf24; }
    .meta-blocked { color: #fca5a5; }
    .meta-tag { color: #60a5fa; }

    .star-btn {
      background: transparent;
      border: none;
      color: #4b5563;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .star-btn:hover { color: var(--text-muted); }
    .star-btn.active { color: var(--myday); }

    /* Modais */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 6
